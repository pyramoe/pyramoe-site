baseURL = "https://pyramoe.com/"
title = "Moaaz Saadsson / Pyramoe"
languageCode = "en"
enableRobotsTXT = true
theme = "hugo-winston-theme"

# If you want /blog/ as the main post section:
[permalinks]
  blog = "/blog/:year/:month/:slug/"

# Taxonomies (tags/categories + your own)
[taxonomies]
  tag = "tags"
  category = "categories"
  topic = "topics"   # optional, useful for cross-cutting themes

[params]
  description = "Linguistics, organizing, politics, and creative tech."
  author = "Moaaz Saadsson"
  copyright = "© 2026 Moaaz Saadsson (Pyramoe)"
  showAuthorOnHomepage = false
  showAuthorOnPosts = false
  showIntroContentOnHomepage = true
  showPostsOnHomepage = true
  usePaginationOnHomepage = false
  limitPostsOnHomepage = 3
  sortPostsByDateOldestFirst = false
  addDot = true
  addFrame = true
  highlightColor = "#9b6bff"
  baseColor = "#0f0b1a"
  baseOffsetColor = "#1a1426"
  headingColor = "#f4f1ff"
  textColor = "#c8bfdc"
  dotColor = "#9b6bff"
  enableGoogleFonts = true
  googleFontsUrl = "https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap"
  fontFamilyHeading = "IBM Plex Sans"
  fontFamilyParagraph = "IBM Plex Sans"
  fontFamilyMonospace = "IBM Plex Mono"

[pagination]
  pagerSize = 6

# Main nav (top-level structure)
[menu]
  [[menu.main]]
    name = "Home"
    pageRef = "/"
    weight = 10
  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 20
  [[menu.main]]
    name = "Linguistics"
    pageRef = "/linguistics"
    weight = 30
  [[menu.main]]
    name = "Politics"
    pageRef = "/politics"
    weight = 40
  [[menu.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 50
  [[menu.main]]
    name = "Creative"
    pageRef = "/creative"
    weight = 60
  [[menu.main]]
    name = "Worldbuilding"
    pageRef = "/worldbuilding"
    weight = 70
  [[menu.main]]
    name = "Media"
    pageRef = "/media"
    weight = 80
  [[menu.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 90
