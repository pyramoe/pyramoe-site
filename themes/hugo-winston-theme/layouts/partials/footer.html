<div class="footer">
  {{ if .Site.Data.social.links }}
  <div class="footer-social">
    {{ range .Site.Data.social.links }}
      <span class="social-icon social-icon-{{ .name | urlize }}">
        <a href="{{ .url }}" title="{{ .name }}" target="_blank" rel="noopener">
          <img src="{{ .image | relURL }}" width="24" height="24" alt="{{ .name }}"/>
        </a>
      </span>
    {{ end }}
  </div>
  {{ end }}
  <div class="footer-contact">
    <div class="footer-contact-title">Contact</div>
    <div class="footer-contact-links">
      <a href="mailto:pyramoe@proton.me">pyramoe@proton.me</a>
      <span class="sep">·</span>
      <a href="https://twitter.com/pyramoe" target="_blank" rel="noopener">Twitter @pyramoe</a>

      <a href="https://discord.com/users/pyramoe" target="_blank" rel="noopener">Discord @pyramoe</a>
      <span class="sep">·</span>
      <a href="https://www.instagram.com/moaaz.saadsson" target="_blank" rel="noopener">Instagram @moaaz.saadsson</a>

</div>
